<!DOCTYPE html><html><head><meta charset="utf-8"><title>result</title></head><body>
<pre id="out">pending</pre>
<script>
(async () => {
  const out = [];
  const o = (s) => out.push(s);
  try {
    o('title: ' + document.title);
    o('ZXing loaded: ' + (typeof ZXing !== 'undefined'));
    o('BrowserMultiFormatReader: ' + (typeof ZXing !== 'undefined' && typeof ZXing.BrowserMultiFormatReader));
    o('secureContext: ' + window.isSecureContext);
    o('getUserMedia: ' + (navigator.mediaDevices && typeof navigator.mediaDevices.getUserMedia));
    document.getElementById('name').value = 'HGUC test';
    buildLinks();
    o('links count: ' + document.getElementById('links').children.length);
    o('first link: ' + document.querySelector('.links a').href);
    document.getElementById('cost').value = '1000';
    document.getElementById('price').value = '3000';
    document.getElementById('channel').value = 'mercari';
    calc();
    o('verdict: ' + /仕入れ判定/.test(document.getElementById('calcTable').innerHTML));
    saveItem();
    o('hist: ' + JSON.parse(localStorage.getItem('sedoriHist')).length);
    // SW registration
    if (navigator.serviceWorker) {
      const reg = await navigator.serviceWorker.getRegistration();
      o('SW registered: ' + !!reg);
    } else o('SW unsupported');
    o('manifest link: ' + !!document.querySelector('link[rel=manifest]'));
  } catch (e) { o('ERROR: ' + e.message + ' @ ' + (e.stack||'').split('\n')[1]); }
  document.getElementById('out').textContent = out.join('\n');
  document.title = 'DONE';
})();
</script>
</body></html>
